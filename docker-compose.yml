services:
  db:
    image: mariadb:11.8
    container_name: glpi-db
    restart: unless-stopped

    ports:
      - "127.0.0.1:3307:3306"

    environment:
      MARIADB_ROOT_PASSWORD: RootPass123!
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: GlpiPass123!

    volumes:
      - db_data:/var/lib/mysql

  glpi:
    image: glpi/glpi:latest
    container_name: glpi
    restart: unless-stopped

    ports:
      - "8080:80"

    environment:
      GLPI_DB_HOST: db
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: GlpiPass123!

    volumes:
      - glpi_data:/var/glpi

    depends_on:
      - db

  slack-integration:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: slack-integration
    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      # Docker internal networking overrides
      GLPI_URL: http://glpi
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: slack_integration

    depends_on:
      - db
      - glpi

volumes:
  db_data:
  glpi_data: